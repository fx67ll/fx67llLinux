server {
	listen       83;
	server_name  html-83;
	root         /usr/share/nginx/html-83;
	index        index.html;

	location / {
		root         /usr/share/nginx/html-83;
		index        index.html;
		# 这里是解决Vue路由的history模式刷新页面后404的问题  
		try_files    $uri $uri/ /index.html;
	}

	
	location ^~ /error-page/ {
		root /usr/share/nginx/html;
		internal;
	}
}