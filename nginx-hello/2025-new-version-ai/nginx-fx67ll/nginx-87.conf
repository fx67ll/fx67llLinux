server {
	listen       87;
	server_name  html-87;
	root         /usr/share/nginx/html-87;
	index        index.html;

	location / {
		root         /usr/share/nginx/html-87;
		index        index.html;
		# 这里是解决Vue路由的history模式刷新页面后404的问题
		try_files $uri $uri/ /index.html;
	}

	
	location ^~ /error-page/ {
		root /usr/share/nginx/html;
		internal;
	}
}