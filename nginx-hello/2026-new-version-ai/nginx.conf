    #  run.fx67ll.com HTTP域名配置
	server {
	    listen 80;
	    server_name run.fx67ll.com;
	    # 这里是自动跳转到https地址的方案
	    return 301 https://$host$request_uri;
		
	    location / {
	        # 这里是临时方案，因为这个还是没解决用jenkins.fx67ll.com访问的问题
	        proxy_pass http://127.0.0.1:81/;
	    }
	}
    #  run.fx67ll.com HTTPS域名配置
	server {
	    listen 443 ssl;
	    server_name run.fx67ll.com;
	
	    # ssl_* 继承 http{} 公共区

        # run 保留专属 50x 页面（覆盖全局 common）；40x 继承全局走 common
        error_page 500 502 503 504 /error-page/50x/server/50x.html;

        location ^~ /error-page/ {
            root /usr/share/nginx/html;
            internal;
        }

	    location / {
	        # 这里是临时方案，因为这个还是没解决用jenkins.fx67ll.com访问的问题
	        proxy_pass http://127.0.0.1:81/;
	    }

        location /jenkins {
            proxy_pass http://127.0.0.1:81/jenkins;  # 指向 Jenkins 实际地址
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;  # 关键：传递协议（https）
            proxy_set_header X-Forwarded-Port $server_port;
        }
	}


