user www www;
worker_processes auto;
error_log /www/wwwlogs/nginx_error.log crit;
pid /www/server/nginx/logs/nginx.pid;
worker_rlimit_nofile 51200;

stream {
    log_format tcp_format '$time_local|$remote_addr|$protocol|$status|$bytes_sent|$bytes_received|$session_time|$upstream_addr|$upstream_bytes_sent|$upstream_bytes_received|$upstream_connect_time';

    access_log /www/wwwlogs/tcp-access.log tcp_format;
    error_log /www/wwwlogs/tcp-error.log;
    include /www/server/panel/vhost/nginx/tcp/*.conf;
}

events {
    use epoll;
    worker_connections 51200;
    multi_accept on;
}

http {
    include mime.types;
    #include luawaf.conf;
    include proxy.conf;

    default_type application/octet-stream;

    server_names_hash_bucket_size 512;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    client_max_body_size 50m;

    sendfile on;
    tcp_nopush on;

    keepalive_timeout 60;

    tcp_nodelay on;

    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 4 64k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_temp_file_write_size 256k;
    fastcgi_intercept_errors on;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json image/svg+xml;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_disable "MSIE [1-6]\.";

    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;

    server_tokens off;
    access_log off;

    # ===== 公共配置区（统一，各 server 继承）=====

    # SSL 全局：证书 + 去 TLS1.1 + life 那套更强 ciphers + session 加大
    ssl_certificate /etc/ssl/fx67ll.ssl/fx67ll.crt;
    ssl_certificate_key /etc/ssl/fx67ll.ssl/fx67ll.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets on;

    # 反代公共：长连接 + 缓冲（不含 proxy_set_header、不含超时，保持现状）
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 错误页全局指向（适用于除 run 外所有 server；run 在自身块内覆盖 50x）
    error_page 404 403 401 /error-page/40x/common/404.html;
    error_page 500 502 503 504 /error-page/50x/common/50x.html;

    # 安全响应头（仅无副作用两项，不含 HSTS / X-Frame-Options）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ===== 公共配置区结束 =====

    # 这里表示 Nginx 会自动加载 /www/server/nginx/conf/vhost/nginx-fx67ll/ 目录下的所有配置文件
    include /www/server/nginx/conf/vhost/nginx-fx67ll/*.conf;

    #  baota.fx67ll.com HTTP域名配置
    server {
        listen 80;
        server_name baota.fx67ll.com;

        location / {
            proxy_pass https://baota.fx67ll.com:10234;
        }
    }
    #  baota.fx67ll.com HTTPS域名配置
    server {
        listen 443 ssl;
        server_name baota.fx67ll.com;

        # ssl_* 继承 http{} 公共区

        location / {
            proxy_pass https://baota.fx67ll.com:10234;
        }
    }

	# 捕获未配置的HTTP二级域名请求，重定向到404页面
	server {
	    listen 80 default_server;
        server_name *.fx67ll.com *.fx67ll.xyz *.ez13.top;
        # 这里是自动跳转到https地址的方案
        rewrite ^(.*)$ https://$host$1 permanent;
	    
	    # 配置404页面
	    error_page 404 /error-page/40x/common/404.html;
	    location = /error-page/40x/common/404.html {
	        root /usr/share/nginx/html;
	        internal;
	    }
	    
	    # 处理所有请求，返回404状态码
	    location / {
	        return 404;
	    }
	}
    # 捕获未配置的HTTPS二级域名请求，重定向到404页面
	server {
	    listen 443 ssl;
        server_name *.fx67ll.com *.fx67ll.xyz *.ez13.top;
	    
	    # SSL证书配置（使用通配符证书，需确保证书存在）
	    # ssl_* 继承 http{} 公共区
	    
	    # 配置404页面
	    error_page 404 /error-page/40x/common/404.html;
	    location = /error-page/40x/common/404.html {
	        root /usr/share/nginx/html;
	        internal;
	    }
	    
	    # 处理所有请求，返回404状态码
	    location / {
	        return 404;
	    }
	}

